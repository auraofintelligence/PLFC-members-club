<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clubhouse demonstration sign-in</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/password-field.css"><script type="module" src="/showcase.js"></script></head>
<body><main class="content page-content"><p class="eyebrow">POINT LOOKOUT FISHING CLUB</p><h1>Explore the clubhouse</h1><p>Welcome! This private demonstration uses example records. You can look around without changing the club’s information.</p><section class="panel"><h2 id="title">Demonstration sign-in</h2><p id="intro">Use the username and password you chose when you accepted your invitation.</p><form id="form" class="stack-form"><label>Username<input name="login" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><label id="repeat-label" hidden>Repeat password<input name="repeat" type="password" autocomplete="new-password"></label><label><input id="show-password" type="checkbox"> Show password</label><button class="button" type="submit">Sign in</button><p role="status" id="status"></p></form></section></main></body></html>
